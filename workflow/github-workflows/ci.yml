name: TinyDB CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TinyDB and test dependencies (including Hypothesis PBT)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov hypothesis pyyaml
          pip install -e .

      - name: Run full pytest + Hypothesis PBT suite
        run: pytest -o addopts="" -v
